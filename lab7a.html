
<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>

    <style>
        
body {
    background: linear-gradient(to right, #141e30, #243b55);

    display: flex;
    justify-content: center;
    align-items: center;

    height: 100vh;

    font-family: Arial, sans-serif;
}

.calculator {
    background-color: #1e1e2f;

    padding: 20px;

    border-radius: 15px;

    box-shadow: 0px 0px 15px white;
}

h1 {
    text-align: center;
    color: white;
}

#result {
    width: 100%;

    height: 60px;

    margin-bottom: 15px;

    font-size: 25px;

    text-align: right;

    padding-right: 10px;

    border: none;

    border-radius: 10px;
}

.buttons {
    display: grid;

    grid-template-columns: repeat(4,70px);

    gap: 10px;
}

button {
    height: 60px;

    border: none;

    border-radius: 50%;

    font-size: 20px;

    cursor: pointer;

    background-color: #333;

    color: white;
}

button:hover {
    background-color: #555;
}

.operator {
    color: #00ff99;
}

.equal {
    background-color: orange;

    color: white;
}


    </style>
    <script>
        
function display(value)
{
    document.getElementById("result").value += value;
}

function calculate()
{
    let exp = document.getElementById("result").value;

    document.getElementById("result").value = eval(exp);
}

function clearResult()
{
    document.getElementById("result").value = "";
}

function deleteLast()
{
    let current = document.getElementById("result").value;

    document.getElementById("result").value =
    current.slice(0, -1);
}


    </script>
</head>

<body>

<div class="calculator">

    <h1>Calculator</h1>

    <input type="text" id="result" readonly>

    <div class="buttons">

        <button onclick="clearResult()" class="operator">AC</button>

        <button onclick="deleteLast()" class="operator">DEL</button>

        <button onclick="display('%')" class="operator">%</button>

        <button onclick="display('/')" class="operator">/</button>

        <button onclick="display('7')">7</button>

        <button onclick="display('8')">8</button>

        <button onclick="display('9')">9</button>

        <button onclick="display('*')" class="operator">*</button>

        <button onclick="display('4')">4</button>

        <button onclick="display('5')">5</button>

        <button onclick="display('6')">6</button>

        <button onclick="display('-')" class="operator">-</button>

        <button onclick="display('1')">1</button>

        <button onclick="display('2')">2</button>

        <button onclick="display('3')">3</button>

        <button onclick="display('+')" class="operator">+</button>

        <button onclick="display('00')">00</button>

        <button onclick="display('0')">0</button>

        <button onclick="display('.')">.</button>

        <button onclick="calculate()" class="equal">=</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
