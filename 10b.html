<?php

if(isset($_POST['number'])){

    $num = $_POST['number'];

    $prime = true;

    if($num <= 1){
        $prime = false;
    }

    for($i=2; $i<$num; $i++){

        if($num % $i == 0){
            $prime = false;
            break;
        }
    }

    if($prime){
        echo $num . " is a Prime Number";
    }
    else{
        echo $num . " is NOT a Prime Number";
    }
}
